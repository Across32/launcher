name: Launcher tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0
          python -m pip install 'PySide6-Essentials>=6.7,<7'
      - name: Compile and validate shell scripts
        run: |
          python -m compileall -q app_manager.py launcher.py app_icons.py release_history.py github_backup.py autostart.py version_info.py update_checker.py tests
          bash -n install.sh run.sh
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          ACROSS32_DISABLE_UPDATE_CHECK: '1'
        run: python -m unittest discover -s tests -v
      - name: Offscreen UI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from launcher import Launcher
          from app_manager import APPS
          app = QApplication([])
          window = Launcher()
          assert len(APPS) == 8
          assert window.grid.count() == len(APPS)
          assert "Across32" in window.windowTitle()
          assert "v1.4.0" in window.windowTitle()
          assert "Git" in window.windowTitle()
          assert "v1.4.0" in window.build_badge.text()
          assert window.backup_button.text().endswith("GITHUB BACKUP")
          assert window.autostart_checkbox.isVisible() is False  # parent window not shown
          window.show()
          app.processEvents()
          assert window.autostart_checkbox.isVisible(), "Setting must be visible in its own header row"
          from PySide6.QtWidgets import QPushButton
          cards = [window.grid.itemAt(i).widget() for i in range(window.grid.count())]
          assert any("Csomagkezelő" in card.findChild(__import__("PySide6.QtWidgets", fromlist=["QLabel"]).QLabel, "appName").text() for card in cards), "Csomagkezelő must have its own card"
          assert sum(bool(card.findChildren(QPushButton, "appIcon")) for card in cards) == len(APPS)
          assert sum(bool(card.findChildren(QPushButton, "history")) for card in cards) == len(APPS)
          assert window.update_process is None
          from update_checker import update_available
          from app_manager import BY_KEY
          window.update_records["laser"] = {"remote_version": "999.0.0", "remote_sha": ""}
          window.refresh()
          cards = [window.grid.itemAt(i).widget() for i in range(window.grid.count())]
          assert sum(bool(card.findChildren(__import__("PySide6.QtWidgets", fromlist=["QLabel"]).QLabel, "updateAvailable")) for card in cards) == 1
          window.update_records["laser"] = {"remote_version": "0.0.0", "remote_sha": ""}
          window.refresh()
          window.minimize_to_tray()
          window.restore_from_tray()
          window.close()
          from unittest.mock import patch
          from PySide6.QtWidgets import QSystemTrayIcon
          window_tray = Launcher()
          with patch.object(QSystemTrayIcon, "isSystemTrayAvailable", return_value=True):
              window_tray.start_in_tray()
              assert not window_tray.isVisible(), "Autostart must not open the main window"
          window_tray.restore_from_tray()
          assert window_tray.isVisible(), "Tray click must open the main window"
          window_tray.close()
          window_no_tray = Launcher()
          with patch.object(QSystemTrayIcon, "isSystemTrayAvailable", return_value=False):
              window_no_tray.start_in_tray()
              assert not window_no_tray.isVisible(), "No window may flash during KDE login"
              assert window_no_tray._startup_tray_pending
          with patch.object(QSystemTrayIcon, "isSystemTrayAvailable", return_value=True):
              window_no_tray.check_startup_tray()
              assert not window_no_tray.isVisible(), "When panel arrives the window stays hidden"
              assert not window_no_tray._startup_tray_pending
          window_no_tray.close()
          print("Launcher UI: OK")
          PY
